---
name: Build and push image

on:
  workflow_call:
    inputs:
      base_image:
        required: true
        type: string
      tag:
        required: true
        type: string
      image_desc:
        required: true
        type: string
      variant_suffix:
        type: string
        default: ""

env:
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue,mt7927,mt6639,wifi7,mediatek"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

jobs:
  build_push:
    name: Build ${{ inputs.base_image }}${{ inputs.variant_suffix }} (${{ inputs.tag }})
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.base_image }}${{ inputs.variant_suffix }}-${{ inputs.tag }}
      cancel-in-progress: true

    steps:
      - name: Prepare environment
        run: |
          IMAGE_NAME="${{ inputs.base_image }}-mt7927${{ inputs.variant_suffix }}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          IMAGE_REGISTRY="${{ env.IMAGE_REGISTRY }}"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "DEFAULT_TAG=${{ inputs.tag }}" >> ${GITHUB_ENV}
          echo "BASE_IMAGE=ghcr.io/ublue-os/${{ inputs.base_image }}:${{ inputs.tag }}" >> ${GITHUB_ENV}

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      # The DKMS submodule's `make download` pulls a ~151MB kernel tarball from
      # cdn.kernel.org and the vendor driver ZIP from the ASUS CDN using a single
      # curl with no retry. All 29 matrix jobs across this and the Bluefin workflow
      # fire on the same cron, so that is a ~4.4GB burst at one CDN edge from one
      # Azure region — the single largest source of CI failures (curl 92 HTTP/2
      # PROTOCOL_ERROR, curl 28 timeout, curl 35 SSL connect).
      #
      # Both of the submodule's download steps are no-ops when the file is already
      # present, so seeding the files here means `make download` never touches the
      # network. The cache is shared across every matrix job and across runs.
      - name: Resolve source versions
        id: srcver
        run: |
          DKMS=build_files/mediatek-mt7927-dkms
          MT76_KVER=$(sed -n "s/^_mt76_kver='\(.*\)'/\1/p" "${DKMS}/PKGBUILD")
          DRIVER_ZIP=$(grep -m1 '^DRIVER_FILENAME=' "${DKMS}/download-driver.sh" \
            | sed 's/.*:-//; s/}"$//')
          test -n "${MT76_KVER}" && test -n "${DRIVER_ZIP}"
          echo "mt76_kver=${MT76_KVER}" >> "${GITHUB_OUTPUT}"
          echo "driver_zip=${DRIVER_ZIP}" >> "${GITHUB_OUTPUT}"

      - name: Cache MT7927 build sources
        uses: actions/cache@v4
        with:
          path: |
            build_files/mediatek-mt7927-dkms/linux-${{ steps.srcver.outputs.mt76_kver }}.tar.xz
            build_files/mediatek-mt7927-dkms/${{ steps.srcver.outputs.driver_zip }}
          key: mt7927-sources-${{ steps.srcver.outputs.mt76_kver }}-${{ steps.srcver.outputs.driver_zip }}

      - name: Fetch MT7927 build sources
        env:
          MT76_KVER: ${{ steps.srcver.outputs.mt76_kver }}
          DRIVER_ZIP: ${{ steps.srcver.outputs.driver_zip }}
        run: |
          set -euo pipefail
          cd build_files/mediatek-mt7927-dkms

          # --http1.1 sidesteps the HTTP/2 PROTOCOL_ERROR cdn.kernel.org returns
          # under concurrent load; -C - resumes a partial transfer rather than
          # restarting all 151MB. The outer loop re-evaluates the resume offset,
          # which curl's own --retry does not do reliably.
          TARBALL="linux-${MT76_KVER}.tar.xz"
          URL="https://cdn.kernel.org/pub/linux/kernel/v${MT76_KVER%%.*}.x/${TARBALL}"
          for attempt in 1 2 3 4 5; do
            # xz -l only reads the stream index at the end of the file, so this
            # rejects a truncated cache entry without decompressing 151MB.
            if [[ -f "${TARBALL}" ]] && xz -l "${TARBALL}" >/dev/null 2>&1; then
              echo "Kernel tarball present and readable: ${TARBALL}"
              break
            fi
            echo "Fetching ${TARBALL} (attempt ${attempt})"
            curl -fL --http1.1 -C - --connect-timeout 30 \
                 --retry 3 --retry-delay 5 --retry-all-errors \
                 -o "${TARBALL}" "${URL}" || true
            if [[ "${attempt}" -eq 5 ]]; then
              echo "::error::could not fetch ${TARBALL} from cdn.kernel.org"
              exit 1
            fi
            sleep $((attempt * 10))
          done

          # download-driver.sh mints a short-lived signed CloudFront URL, so the
          # whole script has to be retried, not just the transfer.
          for attempt in 1 2 3 4 5; do
            if [[ -f "${DRIVER_ZIP}" ]]; then
              echo "Driver ZIP present: ${DRIVER_ZIP}"
              break
            fi
            ./download-driver.sh . && break
            if [[ "${attempt}" -eq 5 ]]; then
              echo "::error::could not fetch ${DRIVER_ZIP} from the ASUS CDN"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ inputs.image_desc }} (based on ${{ inputs.base_image }}:${{ inputs.tag }})
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          oci: false

      - name: Setup Just
        uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Image
        run: just test "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v2.6.1'

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          # 29 jobs signing 2 tags each blows GHCR's 2000 req/minute secondary
          # limit, which surfaces as TOOMANYREQUESTS / 403 permission_denied.
          # cosign has no retry of its own, so back off and try again.
          for tag in ${{ steps.metadata.outputs.tags }}; do
            for attempt in 1 2 3 4 5; do
              if cosign sign -y --key env://COSIGN_PRIVATE_KEY "${IMAGE_FULL}:${tag}"; then
                break
              fi
              if [[ "${attempt}" -eq 5 ]]; then
                echo "::error::cosign sign failed for ${IMAGE_FULL}:${tag}"
                exit 1
              fi
              echo "cosign sign failed for ${tag}, retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            done
          done
        env:
          TAGS: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
